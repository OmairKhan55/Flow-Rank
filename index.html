<script>

let currentTab="Crypto";

let liveData=[];
let chainData=[];
let marketData=[];

function money(value){

if(value===null||value===undefined||isNaN(Number(value)))return"—";

const n=Number(value);

if(n>=1e12)return"$"+(n/1e12).toFixed(2)+"T";
if(n>=1e9)return"$"+(n/1e9).toFixed(2)+"B";
if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M";
if(n>=1e3)return"$"+(n/1e3).toFixed(2)+"K";

return"$"+n.toFixed(2);

}

function change(value){

if(value===null||value===undefined||isNaN(Number(value)))return"—";

const n=Number(value);

return(n>=0?"+":"")+n.toFixed(2)+"%";

}

function price(value){

if(value===null||value===undefined||isNaN(Number(value)))return"—";

return"$"+Number(value).toLocaleString("en-US",{
maximumFractionDigits:8
});

}

function setTab(tab,element){

currentTab=tab;

document.querySelectorAll(".tab")
.forEach(b=>b.classList.remove("active"));

if(element)element.classList.add("active");

render();

}

function comingSoon(name){

alert(name+" is coming next.");

}

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function render(){

const query=
document.getElementById("search")
.value
.trim()
.toLowerCase();

const rows=document.getElementById("rows");
const title=document.getElementById("tableTitle");
const status=document.getElementById("status");
const gainers=document.getElementById("gainers");
const lowerTitle=document.getElementById("lowerTitle");
const source=document.getElementById("source");
const ranking=document.getElementById("ranking");
const overview=document.getElementById("overviewCount");

if(currentTab==="On-Chain"){

title.textContent="Top DEX Pairs by 24h Volume";

status.textContent=
marketData.length
?"Live DEX Market Data"
:"Connecting...";

status.className="status";

source.textContent="GeckoTerminal";
ranking.textContent="24h DEX volume";

overview.textContent=
marketData.length
?marketData.length
:"—";

lowerTitle.textContent="Top Chains by TVL";

document.getElementById("tableHead").innerHTML=`
<th>#</th>
<th>Pair</th>
<th>Network</th>
<th>24h Volume</th>
<th>Liquidity</th>
`;

if(!marketData.length){

rows.innerHTML=`
<tr>
<td colspan="5">
<div class="loading">
Loading DEX market data...
</div>
</td>
</tr>`;

gainers.innerHTML=
`<div class="loading">Loading...</div>`;

return;

}

const filtered=marketData.filter(m=>

(m.name||"")
.toLowerCase()
.includes(query)

||

(m.network||"")
.toLowerCase()
.includes(query)

);

rows.innerHTML=filtered.length?

filtered.map((market,index)=>`

<tr>

<td class="rank">${index+1}</td>

<td>
<span class="asset">
${escapeHTML(market.name||"Unknown")}
</span>
</td>

<td class="network">
${escapeHTML(market.network||"—")}
</td>

<td>
${money(market.volume24h)}
</td>

<td>
${money(market.liquidity)}
</td>

</tr>

`).join("")

:

`<tr>
<td colspan="5">
<div class="empty">
No matching DEX pairs.
</div>
</td>
</tr>`;

if(chainData.length){

gainers.innerHTML=
chainData.slice(0,5).map(chain=>`

<div class="row">

<span>
${escapeHTML(chain.name||"Unknown")}
</span>

<span>
${money(chain.tvl)}
</span>

</div>

`).join("");

}else{

gainers.innerHTML=
`<div class="loading">Loading...</div>`;

}

return;

}

if(currentTab!=="Crypto"){

title.textContent=currentTab+" market data";

status.textContent="Coming next";
status.className="status";

source.textContent="—";
ranking.textContent="—";
overview.textContent="—";

lowerTitle.textContent="Coming soon";

document.getElementById("tableHead").innerHTML=`

<th>#</th>
<th>Asset</th>
<th>Market</th>
<th>Volume</th>
<th>Change</th>

`;

rows.innerHTML=`

<tr>
<td colspan="5">

<div class="empty">
The ${escapeHTML(currentTab)}
data feed will be connected next.
</div>

</td>
</tr>

`;

gainers.innerHTML=
`<div class="empty">Coming soon</div>`;

return;

}

/* =========================
   CRYPTO PAIRS
========================= */

title.textContent="Top Crypto Pairs by 24h Volume";

status.textContent=
liveData.length
?"Live Crypto Pair Data"
:"Connecting...";

status.className="status";

source.textContent="Binance";
ranking.textContent="24h pair volume";

overview.textContent=
liveData.length
?liveData.length
:"—";

lowerTitle.textContent="Top Gainers (24h)";

document.getElementById("tableHead").innerHTML=`

<th>#</th>
<th>Pair</th>
<th>Exchange</th>
<th>Price</th>
<th>24h Volume</th>
<th>24h Change</th>

`;

const filtered=liveData.filter(market=>

(market.pair||"")
.toLowerCase()
.includes(query)

||

(market.exchange||"")
.toLowerCase()
.includes(query)

);

rows.innerHTML=filtered.length?

filtered.map((market,index)=>{

const p=Number(market.change24h||0);

return`

<tr>

<td class="rank">
${index+1}
</td>

<td>
<span class="asset">
${escapeHTML(market.pair||"Unknown")}
</span>
</td>

<td class="network">
${escapeHTML(market.exchange||"—")}
</td>

<td>
${price(market.price)}
</td>

<td>
${money(market.volume24h)}
</td>

<td class="${p>=0?"up":"down"}">
${change(p)}
</td>

</tr>

`;

}).join("")

:

`

<tr>
<td colspan="6">

<div class="empty">
No matching pairs.
</div>

</td>
</tr>

`;

const top=[...liveData]

.sort((a,b)=>
Number(b.change24h||0)-
Number(a.change24h||0)
)

.slice(0,5);

gainers.innerHTML=top.length?

top.map(market=>{

const p=Number(market.change24h||0);

return`

<div class="row">

<span>
${escapeHTML(market.pair||"Unknown")}
</span>

<span class="${p>=0?"up":"down"}">
${change(p)}
</span>

</div>

`;

}).join("")

:

`<div class="loading">Loading...</div>`;

document.getElementById("cryptoCount")
.textContent=
liveData.length
?"Top "+liveData.length+" Pairs"
:"Loading...";

}

async function loadCrypto(){

try{

const response=
await fetch(
"/api/crypto",
{cache:"no-store"}
);

if(!response.ok)
throw new Error("Crypto API failed");

const data=
await response.json();

if(!Array.isArray(data))
throw new Error("Invalid crypto data");

liveData=data

.filter(m=>
m.pair &&
m.exchange &&
Number(m.volume24h||0)>0
)

.sort((a,b)=>
Number(b.volume24h||0)-
Number(a.volume24h||0)
)

.slice(0,100);

render();

}catch(error){

console.error(error);

document.getElementById("status")
.textContent="API Error";

document.getElementById("status")
.className="status error";

}

}

async function loadOnChain(){

try{

const response=
await fetch(
"/api/onchain",
{cache:"no-store"}
);

if(!response.ok)
throw new Error("On-Chain API failed");

const data=
await response.json();

if(!Array.isArray(data))
throw new Error("Invalid On-Chain data");

chainData=data

.filter(c=>
c.tvl!==null &&
c.tvl!==undefined
)

.sort((a,b)=>
Number(b.tvl||0)-
Number(a.tvl||0)
);

document.getElementById("chainCount")
.textContent=
chainData.length+" Chains";

render();

}catch(error){

console.error(error);

document.getElementById("chainCount")
.textContent="API Error";

}

}

async function loadMarkets(){

try{

const response=
await fetch(
"/api/markets",
{cache:"no-store"}
);

if(!response.ok)
throw new Error("DEX Market API failed");

const data=
await response.json();

if(!Array.isArray(data))
throw new Error("Invalid DEX market data");

/*
Minimum liquidity filter.
Removes abnormal pools
with huge volume and very low liquidity.
*/

marketData=data

.filter(m=>
Number(m.liquidity||0)>=100000 &&
Number(m.volume24h||0)>0
)

.sort((a,b)=>
Number(b.volume24h||0)-
Number(a.volume24h||0)
)

.slice(0,100);

render();

}catch(error){

console.error(error);

if(currentTab==="On-Chain"){

document.getElementById("status")
.textContent="DEX API Error";

document.getElementById("status")
.className="status error";

}

}

}

document
.getElementById("search")
.addEventListener(
"input",
render
);

render();

loadCrypto();
loadOnChain();
loadMarkets();

</script>
