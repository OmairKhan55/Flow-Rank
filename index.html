<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FlowRank — See Where The Volume Flows</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #05070b;
    }

    body {
      margin: 0;
      background: #05070b;
      color: #f5f7fa;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(5, 7, 11, 0.96);
      border-bottom: 1px solid #1b2029;
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 1500px;
      margin: auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #ffffff,
        #7d8797
      );
      color: #05070b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      color: #7d8797;
      font-size: 11px;
      margin-top: 3px;
    }

    .search {
      width: min(430px, 100%);
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border-radius: 10px;
      border: 1px solid #252c37;
      background: #0b0f15;
      color: white;
      outline: none;
    }

    .search input:focus {
      border-color: #4a5565;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #778191;
    }

    .container {
      max-width: 1500px;
      margin: auto;
      padding: 24px 22px 60px;
    }

    .hero {
      padding: 18px 0 22px;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .hero p {
      margin: 8px 0 0;
      color: #8c96a5;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 18px;
    }

    .tab {
      border: 1px solid #242b36;
      background: #0b0f15;
      color: #8993a2;
      padding: 9px 16px;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab:hover {
      color: white;
    }

    .tab.active {
      background: #f4f6f8;
      color: #05070b;
      border-color: #f4f6f8;
      font-weight: 700;
    }

    .chains {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .chain {
      border: 1px solid #222934;
      background: #090d13;
      color: #8e98a7;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .chain:hover {
      color: white;
    }

    .chain.active {
      color: white;
      border-color: #667080;
      background: #111720;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: #090d13;
      border: 1px solid #1c232d;
      border-radius: 12px;
      padding: 16px;
    }

    .stat-label {
      color: #7e8999;
      font-size: 12px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 7px;
    }

    .panel {
      border: 1px solid #1c232d;
      border-radius: 14px;
      overflow: hidden;
      background: #080c11;
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid #1c232d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 800;
    }

    .panel-subtitle {
      color: #778292;
      font-size: 12px;
      margin-top: 4px;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #8f9aaa;
      font-size: 12px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #63d391;
      box-shadow:
        0 0 8px rgba(99, 211, 145, 0.6);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th {
      text-align: left;
      padding: 12px 14px;
      color: #6f7988;
      font-size: 11px;
      font-weight: 700;
      border-bottom: 1px solid #1b222c;
      white-space: nowrap;
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid #121820;
      font-size: 12px;
      white-space: nowrap;
    }

    tr:hover td {
      background: #0c1118;
    }

    .rank {
      color: #6e7887;
      width: 45px;
    }

    .pair {
      font-weight: 750;
      color: #f5f7fa;
    }

    .network {
      color: #9aa4b3;
    }

    .positive {
      color: #65d391;
    }

    .negative {
      color: #ff7474;
    }

    .muted {
      color: #737e8d;
    }

    .new-badge {
      display: inline-block;
      margin-left: 7px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #202833;
      color: #c9d1dc;
      font-size: 9px;
      font-weight: 800;
    }

    .value-type {
      display: block;
      color: #687382;
      font-size: 9px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .chain-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .chain-card {
      border: 1px solid #1c232d;
      background: #090d13;
      border-radius: 11px;
      padding: 14px;
    }

    .chain-card-name {
      font-weight: 750;
    }

    .chain-card-value {
      font-size: 18px;
      font-weight: 800;
      margin-top: 8px;
    }

    .chain-card-label {
      color: #6f7988;
      font-size: 11px;
      margin-top: 3px;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #737e8d;
    }

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: #737e8d;
    }

    .error {
      padding: 35px 20px;
      text-align: center;
      color: #ff7d7d;
    }

    .error-small {
      color: #6f7988;
      font-size: 11px;
      margin-top: 8px;
    }

    .footer {
      padding: 35px 0 0;
      text-align: center;
      color: #56606f;
      font-size: 11px;
    }

    @media (max-width: 900px) {

      .topbar-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .chain-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {

      .container {
        padding-left: 13px;
        padding-right: 13px;
      }

      .hero h1 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .stat {
        padding: 12px;
      }

      .stat-value {
        font-size: 18px;
      }

      .chain-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .panel-head {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <div class="brand-icon">
          F
        </div>

        <div>

          <div class="brand-title">
            FlowRank
          </div>

          <div class="brand-subtitle">
            See Where The Volume Flows
          </div>

        </div>

      </div>


      <div class="search">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="searchInput"
          type="text"
          placeholder="Search pair, token or network..."
        >

      </div>

    </div>

  </header>


  <main class="container">

    <section class="hero">

      <h1>
        Market Activity Dashboard
      </h1>

      <p>
        Track crypto, on-chain activity,
        liquidity and market volume in one place.
      </p>

    </section>


    <div class="tabs">

      <button
        class="tab active"
        data-tab="Crypto"
      >
        Crypto
      </button>

      <button
        class="tab"
        data-tab="On-Chain"
      >
        On-Chain
      </button>

      <button
        class="tab"
        data-tab="Stocks"
      >
        Stocks
      </button>

      <button
        class="tab"
        data-tab="Forex"
      >
        Forex
      </button>

    </div>


    <div
      id="chainButtons"
      class="chains"
    ></div>


    <div
      id="stats"
      class="stats"
    ></div>


    <section class="panel">

      <div class="panel-head">

        <div>

          <div
            id="panelTitle"
            class="panel-title"
          >
            Crypto Markets
          </div>

          <div
            id="panelSubtitle"
            class="panel-subtitle"
          >
            Loading market data...
          </div>

        </div>


        <div class="live">

          <span class="live-dot"></span>

          Live Data

        </div>

      </div>


      <div
        id="content"
        class="table-wrap"
      >

        <div class="loading">
          Loading crypto markets...
        </div>

      </div>

    </section>


    <section
      id="extraSection"
      class="section"
    ></section>


    <div class="footer">
      FlowRank • Market data dashboard
    </div>

  </main>


  <script>

    let currentTab = "Crypto";

    let selectedChain = "all";

    let liveData = [];

    let chainData = [];

    let marketData = [];

    let searchTerm = "";


    function money(value) {

      const n = Number(value || 0);

      if (!n) {
        return "—";
      }

      if (n >= 1e12) {
        return "$" +
          (n / 1e12).toFixed(2) +
          "T";
      }

      if (n >= 1e9) {
        return "$" +
          (n / 1e9).toFixed(2) +
          "B";
      }

      if (n >= 1e6) {
        return "$" +
          (n / 1e6).toFixed(2) +
          "M";
      }

      if (n >= 1e3) {
        return "$" +
          (n / 1e3).toFixed(2) +
          "K";
      }

      return "$" +
        n.toFixed(2);
    }


    function number(value) {

      const n = Number(value || 0);

      return n.toLocaleString(
        "en-US",
        {
          maximumFractionDigits: 0
        }
      );
    }


    function price(value) {

      const n = Number(value || 0);

      if (!n) {
        return "—";
      }

      if (n >= 1) {

        return "$" +
          n.toLocaleString(
            "en-US",
            {
              maximumFractionDigits: 4
            }
          );

      }

      return "$" +
        n.toLocaleString(
          "en-US",
          {
            maximumFractionDigits: 8
          }
        );
    }


    function change(value) {

      const n = Number(value || 0);

      const cls =
        n >= 0
          ? "positive"
          : "negative";

      const sign =
        n > 0
          ? "+"
          : "";

      return `
        <span class="${cls}">
          ${sign}${n.toFixed(2)}%
        </span>
      `;
    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function chainLabel(value) {

      const map = {

        eth: "Ethereum",

        solana: "Solana",

        base: "Base",

        bsc: "BNB",

        arbitrum: "Arbitrum",

        polygon_pos: "Polygon",

        avalanche: "Avalanche"

      };

      return map[value] || value;
    }


    function age(date) {

      if (!date) {
        return "—";
      }

      const created =
        new Date(date).getTime();

      if (!created) {
        return "—";
      }

      const diff =
        Date.now() - created;

      const days =
        Math.floor(
          diff /
          (1000 * 60 * 60 * 24)
        );

      if (days < 1) {
        return "Today";
      }

      if (days === 1) {
        return "1 day";
      }

      return days + " days";
    }


    function isNew(date) {

      if (!date) {
        return false;
      }

      const created =
        new Date(date).getTime();

      if (!created) {
        return false;
      }

      return (
        Date.now() - created
      ) <=
        7 *
        24 *
        60 *
        60 *
        1000;
    }


    function filteredMarkets() {

      let data =
        [...marketData];


      if (
        selectedChain !== "all"
      ) {

        data =
          data.filter(
            item =>
              item.network ===
              selectedChain
          );

      }


      if (searchTerm) {

        const term =
          searchTerm.toLowerCase();

        data =
          data.filter(item =>

            String(
              item.name || ""
            )
              .toLowerCase()
              .includes(term)

            ||

            String(
              item.network || ""
            )
              .toLowerCase()
              .includes(term)

          );

      }


      return data;
    }


    function renderStats() {

      const stats =
        document.getElementById(
          "stats"
        );


      if (
        currentTab === "Crypto"
      ) {

        const volume =
          liveData.reduce(
            (sum, item) =>
              sum +
              Number(
                item.volume24h ||
                item.quoteVolume ||
                0
              ),
            0
          );


        stats.innerHTML = `

          <div class="stat">

            <div class="stat-label">
              Crypto Pairs
            </div>

            <div class="stat-value">
              ${number(
                liveData.length
              )}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              24H Volume
            </div>

            <div class="stat-value">
              ${money(volume)}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Exchange
            </div>

            <div class="stat-value">
              Binance
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Data Status
            </div>

            <div class="stat-value">
              Live
            </div>

          </div>

        `;

        return;
      }


      if (
        currentTab === "On-Chain"
      ) {

        const data =
          filteredMarkets();


        const volume =
          data.reduce(
            (sum, item) =>
              sum +
              Number(
                item.volume24h || 0
              ),
            0
          );


        const liquidity =
          data.reduce(
            (sum, item) =>
              sum +
              Number(
                item.liquidity || 0
              ),
            0
          );


        const transactions =
          data.reduce(
            (sum, item) =>
              sum +
              Number(
                item.transactions24h || 0
              ),
            0
          );


        stats.innerHTML = `

          <div class="stat">

            <div class="stat-label">
              DEX Markets
            </div>

            <div class="stat-value">
              ${number(data.length)}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              24H Volume
            </div>

            <div class="stat-value">
              ${money(volume)}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              Liquidity
            </div>

            <div class="stat-value">
              ${money(liquidity)}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              24H Transactions
            </div>

            <div class="stat-value">
              ${number(transactions)}
            </div>

          </div>

        `;

        return;
      }


      stats.innerHTML = `

        <div class="stat">

          <div class="stat-label">
            Status
          </div>

          <div class="stat-value">
            Coming Next
          </div>

        </div>

      `;
    }


    function renderChainButtons() {

      const box =
        document.getElementById(
          "chainButtons"
        );


      if (
        currentTab !== "On-Chain"
      ) {

        box.innerHTML = "";

        return;
      }


      const networks = [

        {
          id: "all",
          name: "All Networks"
        },

        {
          id: "eth",
          name: "Ethereum"
        },

        {
          id: "solana",
          name: "Solana"
        },

        {
          id: "base",
          name: "Base"
        },

        {
          id: "bsc",
          name: "BNB"
        },

        {
          id: "arbitrum",
          name: "Arbitrum"
        },

        {
          id: "polygon_pos",
          name: "Polygon"
        },

        {
          id: "avalanche",
          name: "Avalanche"
        }

      ];


      box.innerHTML =
        networks
          .map(
            network => `

              <button
                class="chain ${
                  selectedChain ===
                  network.id
                    ? "active"
                    : ""
                }"
                onclick="selectChain('${network.id}')"
              >
                ${network.name}
              </button>

            `
          )
          .join("");
    }


    function renderCrypto() {

      const content =
        document.getElementById(
          "content"
        );


      const title =
        document.getElementById(
          "panelTitle"
        );


      const subtitle =
        document.getElementById(
          "panelSubtitle"
        );


      title.textContent =
        "Top Crypto Pairs by 24h Volume";


      subtitle.textContent =
        "Binance • Ranked by 24h trading volume";


      let data =
        [...liveData];


      if (searchTerm) {

        const term =
          searchTerm.toLowerCase();


        data =
          data.filter(item =>

            String(
              item.pair ||
              item.symbol ||
              ""
            )
              .toLowerCase()
              .includes(term)

          );

      }


      if (!data.length) {

        content.innerHTML = `

          <div class="empty">
            No crypto markets found.
          </div>

        `;

        return;
      }


      content.innerHTML = `

        <table>

          <thead>

            <tr>

              <th>#</th>

              <th>Pair</th>

              <th>Exchange</th>

              <th>Price</th>

              <th>24H Volume</th>

              <th>24H Change</th>

            </tr>

          </thead>


          <tbody>

            ${data
              .map(
                (item, index) => {

                  const pair =
                    item.pair ||
                    item.symbol ||
